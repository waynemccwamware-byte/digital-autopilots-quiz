<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Know the Score(board)? – a Quiz</title>
<style>
  :root{
    --bg:#0b0e11;
    --panel:#151a20;
    --panel2:#1b2129;
    --line:#2a323b;
    --text:#e8ecef;
    --muted:#8b96a3;
    --white-ann:#eef0e6;
    --green-ann:#35d07f;
    --amber:#ffb020;
    --blue:#5ab4ff;
    --cyan:#00e5ff;
    --red:#ff5c5c;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  #app{max-width:760px;margin:0 auto;
    padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));}

  .topbar{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 10px;
    padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin-bottom:6px;font-family:var(--mono);font-size:13px;color:var(--muted);}
  .topbar b{color:var(--green-ann);}
  .tbChip{white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .tbChip input{accent-color:var(--amber);cursor:pointer;}
  /* Voice & radio (20-Oct-2026): the Clearance Delivery panel standard (App Conventions §12), behind a
     🔊 button in the top bar; closed by default. Quiz palette/fonts per the §3a exception. Quiz adds Mute ATC. */
  /* §12 button icon (option B, 20-Oct-2026): flat amber speaker; speaker + × when muted */
  .vpToggle{display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:30px;padding:0;
    margin-left:auto;border:1px solid rgba(255,176,32,.45);border-radius:6px;background:rgba(255,176,32,.08);cursor:pointer;color:var(--amber);}
  .vpToggle:hover,.vpToggle[aria-expanded="true"]{border-color:var(--amber);background:rgba(255,176,32,.16);}
  .vpToggle svg{width:20px;height:20px;display:block;}
  .vpPanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;margin-bottom:6px;}
  .vpPanel[hidden]{display:none;}
  .vpHead{font-size:12.5px;color:var(--amber);margin-bottom:6px;}
  .vpLabel{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 3px;}
  .vpPanel select{width:100%;font:16px var(--sans);color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:6px 8px;margin-bottom:4px;}
  .vpSlider{display:grid;grid-template-columns:62px minmax(0,1fr) 50px;align-items:center;gap:8px;margin:2px 0;}
  .vpSlider span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .vpSlider input{width:100%;accent-color:var(--amber);margin:0;}
  .vpSlider output{font:500 12px var(--mono);color:var(--amber);text-align:right;}
  .vpPresets{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px 70px;}
  .vpBtn{font:500 12px var(--sans);padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}
  .vpBtn:hover{color:var(--amber);border-color:var(--amber);}
  .vpChk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);cursor:pointer;margin-top:6px;}
  .vpChk input{width:17px;height:17px;accent-color:var(--amber);flex:none;margin:0;}
  .vpChk small{color:var(--muted);font-size:11.5px;}
  .vpPanel select.voiceSelect{max-width:none;color:var(--text);font-family:var(--sans);background:var(--bg);}
  .vpPanel select.voiceSelect:hover{color:var(--text);border-color:var(--amber);}
  @media (max-width:430px){ .vpPresets{margin-left:0;gap:5px;} .vpBtn{padding:5px 8px;} }
  .vpHint{font-size:11.5px;color:var(--muted);line-height:1.4;margin:6px 0 0;}
  .progressWrap{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px;}
  .progressBar{height:100%;background:var(--green-ann);width:0%;transition:width .3s ease;}

  h1{font-size:18px;line-height:1.25;font-weight:600;letter-spacing:.2px;margin:0 0 2px;}
  .purposeLine{font-size:13.5px;line-height:1.5;margin:0 0 16px;}
  .cmdStrip{display:grid;grid-template-columns:repeat(5,1fr);max-width:340px;margin:0 auto 20px;border:1px solid #333;}
  .cmdStrip div{background:#5f5f5f;font:400 20px/1 Arial,Helvetica,sans-serif;text-align:center;padding:14px 0;border-left:1px solid #4a4a4a;}
  .cmdStrip div:first-child{border-left:none;}
  .cmdStrip .g{color:#2bff2b;} .cmdStrip .w{color:#fff;} .cmdStrip .ap{background:#7a7a7a;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.5;}
  .introLinks{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px;padding-left:20px;}
  .introLinks a{color:var(--blue);text-decoration:underline;}
  .introLinks a:hover{color:var(--text);}

  .flightTag{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--blue);
    background:rgba(90,180,255,.08);border:1px solid rgba(90,180,255,.25);
    padding:3px 9px;border-radius:20px;margin-bottom:10px;}

  .qTop{display:flex;gap:16px;align-items:flex-start;}
  .qMain{flex:1;min-width:0;}
  .sitGfx{flex:0 0 auto;align-self:flex-end;display:flex;gap:4px;padding:6px;border-radius:10px;border:1px solid var(--line);
    background:linear-gradient(#3a6fae 0%, #3a6fae 52%, #e8ecef 52%, #e8ecef 52.6%, #6b4a26 52.6%, #6b4a26 100%);}
  .sitGfx svg{display:block;}
  @media (max-width:560px){ .qTop{flex-direction:column;gap:8px;} .sitGfx{align-self:center;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;}

  .atcRow{display:flex;align-items:flex-start;gap:10px;}
  .atcIcon{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:rgba(90,180,255,.12);
    border:1px solid rgba(90,180,255,.3);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .atcText{flex:1;font-size:15.5px;line-height:1.5;color:var(--text);}
  .graySuffix{color:var(--muted);}
  .atcLabel{font-family:var(--mono);font-size:10.5px;color:var(--blue);letter-spacing:.06em;margin-bottom:3px;}
  .speakBtn{margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--blue);
    background:transparent;border:1px solid rgba(90,180,255,.35);border-radius:20px;padding:4px 11px;cursor:pointer;}
  .speakBtn:hover{background:rgba(90,180,255,.1);}

  .actionsLabel{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin:10px 0 4px;}
  .situationText{font-size:14.5px;line-height:1.5;color:var(--text);}
  ul.actions{margin:0;padding-left:20px;}
  ul.actions li{font-size:14.5px;line-height:1.45;color:var(--text);margin-bottom:2px;}
  .noAction{font-size:13.5px;color:var(--muted);font-style:italic;padding:4px 0;}
  .contNote{font-family:var(--mono);font-size:12.5px;color:var(--cyan);margin:4px 0 8px;}
  .preamble{font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:8px;}
  .flagLine{font-size:13.5px;color:var(--text);margin-bottom:8px;}
  .flightImgWrap{margin:0 0 8px;}
  .flightImgBox{position:relative;width:66.67%;margin:0 auto;border-radius:12px;overflow:hidden;}
  .flightImg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;box-sizing:border-box;}
  .flightAc{position:absolute;transform:translate(-50%,-50%);overflow:visible;pointer-events:none;
    filter:drop-shadow(0 0 1.5px rgba(0,0,0,.8));}
  .flightImgCaption{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;}

  .refLink{display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 12px;
    background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.3);border-radius:10px;
    font-size:13px;color:var(--amber);text-decoration:none;}
  .refLink:hover{background:rgba(255,176,32,.13);}

  .slotsLabel{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin:12px 0 8px;}
  .card > .slotsLabel:first-child{margin-top:0;}
  .slotGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .slotGroup{margin-bottom:4px;min-width:0;}
  .slotGroup.apGroup{background:#2c3540;border-radius:10px;padding:5px;margin:-5px -5px -1px;}
  .slotName{font-size:10.5px;color:var(--muted);margin-bottom:4px;font-family:var(--mono);letter-spacing:.02em;min-height:26px;}
  .slotBox{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px;
    font-family:var(--mono);font-size:16px;font-weight:700;line-height:1.15;padding:6px 4px;text-align:center;
    border-radius:8px;background:var(--panel2);}
  .slotBox.selGreen{color:var(--green-ann);border:1.5px solid var(--green-ann);}
  .slotBox.selWhite{color:var(--white-ann);border:1.5px solid var(--white-ann);}
  .slotBox.dis{opacity:.65;}
  .slotBox:focus-within{outline:2px solid var(--amber);outline-offset:2px;}
  .slotBox select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;
    appearance:none;-webkit-appearance:none;border:0;}
  .slotBox select:disabled{cursor:default;}
  .slotBox select option{background:var(--panel2);color:var(--text);}
  @media (max-width:560px){
    .slotGrid{gap:6px;}
    .slotName{font-size:9px;letter-spacing:0;}
    .slotBox{font-size:13px;padding:6px 2px;}
    .slotGroup.apGroup{padding:3px;margin:-3px -3px 1px;}
  }

  .mcOption{display:block;width:100%;text-align:left;font-size:14px;line-height:1.5;
    padding:11px 13px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);cursor:pointer;}
  .mcOption:hover{border-color:#3a4552;}
  .mcOption.sel{border-color:var(--blue);background:rgba(90,180,255,.1);}

  .submitBtn{width:100%;margin-top:10px;padding:11px;border-radius:10px;border:none;
    background:var(--green-ann);color:#08110c;font-weight:600;font-size:14.5px;cursor:pointer;}
  .submitBtn:disabled{background:#2a323b;color:var(--muted);cursor:not-allowed;}
  .nextBtn{width:100%;margin-top:10px;padding:11px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-weight:600;font-size:14.5px;cursor:pointer;}

  .resultBanner{margin-top:10px;padding:9px 12px;border-radius:10px;font-family:var(--mono);
    font-size:13px;display:flex;align-items:center;gap:10px;}
  .resultBanner.good{background:rgba(53,208,127,.1);border:1px solid rgba(53,208,127,.4);color:var(--green-ann);}
  .resultBanner.bad{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.4);color:var(--red);}

  .annStrip{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .annBox{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:8px;flex:1;min-width:90px;text-align:center;}
  .annBox .k{display:block;font-size:9.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.05em;}
  .annBox.match{background:rgba(53,208,127,.1);border:1px solid rgba(53,208,127,.4);}
  .annBox.miss{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.4);}
  .annBox .v{font-weight:700;}
  .annBox .yours{display:block;font-size:10.5px;color:var(--red);margin-top:2px;font-weight:400;}

  .overlay{position:fixed;inset:0;background:rgba(5,7,9,.82);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:50;}
  .modal{max-width:520px;background:var(--panel);border:1px solid var(--amber);border-radius:16px;
    padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .kiBox{border:1.5px solid var(--amber);}
  .kiBox .kiTag{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em;margin-bottom:8px;}
  .kiBox h3{margin:0 0 10px;font-size:17px;color:var(--amber);}
  .kiBox p{font-size:14px;line-height:1.6;color:var(--text);margin:0 0 14px;}
  .kiBox .rowBtns{display:flex;align-items:center;gap:10px;}
  .voiceBtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer;}

  .startBtn{width:100%;padding:15px;border-radius:12px;border:none;background:var(--green-ann);
    color:#08110c;font-weight:700;font-size:15.5px;cursor:pointer;margin-top:10px;}

  .summaryScore{font-size:44px;font-weight:700;font-family:var(--mono);color:var(--green-ann);margin:6px 0 2px;}
  .kiRecap{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .kiRecap b{color:var(--amber);font-size:13px;}
  .kiRecap p{margin:5px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted);}

  /* Study mode (26-Oct-2026): step back and forth; score marked unofficial */
  .smRow{display:flex;align-items:flex-start;gap:9px;margin:14px 2px 0;font-size:13.5px;color:var(--text);cursor:pointer;line-height:1.45;}
  .smRow input{width:18px;height:18px;accent-color:var(--amber);flex:none;margin:1px 0 0;cursor:pointer;}
  .smRow small{display:block;color:var(--muted);font-size:12px;}
  .smNav{flex:0 0 auto;width:28px;height:26px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font:600 16px/1 var(--mono);cursor:pointer;}
  .smNav:hover:not(:disabled){border-color:var(--amber);color:var(--amber);}
  .smNav:disabled{opacity:.35;cursor:default;}
  .smStar{color:var(--amber);}
  .topbar .smNav{display:inline-block;}
  .topbar select.flightSelect{flex:0 0 auto;}
  .smTb{gap:4px;cursor:pointer;color:var(--muted);}
  .smTb input{width:15px;height:15px;margin:0;}
  @media (max-width:480px){                                  /* phones: one row still fits */
    .topbar .smNav{display:none;}                            /* use the ‹ › beside Next question */
    .topbar .tbWord{display:none;}                           /* "Score" word; the numbers stay */
    .topbar{gap:6px 7px;padding:6px 8px;}
  }
  @media (max-width:350px){ .topbar{flex-wrap:wrap;} }       /* very small phones: allow a second row */
  .navRow{display:flex;gap:8px;align-items:stretch;margin-top:10px;}
  .navRow > .submitBtn,.navRow > .nextBtn{margin-top:0;flex:1;}
  .navRow > .smNav{width:46px;height:auto;font-size:20px;border-radius:10px;}
  .tryBtn{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px solid rgba(255,176,32,.45);
    background:rgba(255,176,32,.08);color:var(--amber);font-weight:600;font-size:13.5px;cursor:pointer;}
  .smBanner{margin:0 0 12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--amber);background:rgba(255,176,32,.10);
    color:var(--amber);font-size:13.5px;line-height:1.5;}
  .smBanner b{display:block;font-size:15px;margin-bottom:3px;}
  .smBanner span{color:var(--text);}
  .replayBtn{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-weight:600;font-size:14px;cursor:pointer;margin-top:16px;}

  .muteRow .vpToggle{margin-left:0;}
  .muteRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  .muteRow label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .muteRow input{accent-color:var(--amber);cursor:pointer;}
  select.voiceSelect{font-family:var(--mono);font-size:16px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer;max-width:220px;}
  select.voiceSelect:hover{border-color:var(--blue);color:var(--blue);}
  select.flightSelect{font-family:var(--mono);font-size:16px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:2px 4px;cursor:pointer;flex:0 1 auto;min-width:0;}
  select.flightSelect:hover{border-color:var(--blue);color:var(--blue);}
  button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  @media (max-width:480px){ .chip{font-size:11.5px;padding:5px 9px;} }
  .annBox.apBox{box-shadow:0 0 0 4px #2c3540;}
  @media (max-width:560px){
    .annStrip{flex-wrap:nowrap;gap:5px;}
    .annBox{min-width:0;padding:6px 2px;font-size:11px;}
    .annBox .k{font-size:8px;letter-spacing:0;}
    .annBox .yours{font-size:9.5px;}
    .annBox.apBox{box-shadow:0 0 0 3px #2c3540;}
  }
</style>
<!-- GGP-FOOTER-CSS START v1.3 · 29-Oct-2026 · shared footer styles, App Conventions §5b · master: Control Panel repo tools/ggp-footer -->
<style>
.ggp-footer{
  --ggp-amber:#f5a623; --ggp-muted:#8b93a1; --ggp-bezel:#2a323f; --ggp-bezel-hi:#3a4454;
  box-sizing:border-box; width:100%; max-width:640px; margin:28px auto 0; padding:16px 0 8px;
  border-top:1px solid var(--ggp-bezel); text-align:center;
  font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:11px; line-height:1.5; color:var(--ggp-muted);
}
.ggp-footer *, .ggp-footer *::before, .ggp-footer *::after{ box-sizing:border-box; }
.ggp-footer .ggp-back{ margin:0 0 12px; }
.ggp-footer .ggp-back a{
  display:inline-block; padding:6px 14px; border:1px solid var(--ggp-bezel-hi); border-radius:5px;
  background:var(--ggp-bezel); color:var(--ggp-amber); font-size:12px; font-weight:500; text-decoration:none;
}
.ggp-footer .ggp-back a:hover{ background:var(--ggp-bezel-hi); color:var(--ggp-amber); text-decoration:none; }
.ggp-footer .ggp-extra{ margin:0 0 6px; text-wrap:balance; }
.ggp-footer .ggp-credit{ margin:0; }
.ggp-footer .ggp-extra a, .ggp-footer .ggp-credit a{
  color:var(--ggp-muted); text-decoration:none; border-bottom:1px solid var(--ggp-bezel-hi); padding-bottom:1px;
}
.ggp-footer .ggp-extra a:hover, .ggp-footer .ggp-credit a:hover{ color:var(--ggp-amber); border-bottom-color:var(--ggp-amber); }
.ggp-footer .ggp-count{ margin-top:6px; }
.ggp-footer .ggp-count:empty{ display:none; }
.ggp-footer .ggp-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px; }
.ggp-footer .ggp-pill{
  display:inline-flex; align-items:center; gap:7px; margin:0; padding:8px 16px;
  border:1px solid var(--ggp-bezel-hi); border-radius:20px; background:transparent; color:var(--ggp-muted);
  font:inherit; font-size:12.5px; line-height:1.2; cursor:pointer; transition:color .15s ease, border-color .15s ease;
}
.ggp-footer .ggp-pill:hover{ color:var(--ggp-amber); border-color:var(--ggp-amber); background:transparent; }
.ggp-footer .ggp-pill svg{ width:15px; height:15px; flex-shrink:0; }
.ggp-footer .ggp-pill span{ text-wrap:balance; }
@media (max-width:400px){ .ggp-footer .ggp-pill{ font-size:12px; padding:8px 12px; gap:6px; } }
.ggp-footer a:focus-visible, .ggp-footer .ggp-pill:focus-visible{ outline:2px solid var(--ggp-amber); outline-offset:2px; }
@media print{
  .ggp-footer .ggp-back, .ggp-footer .ggp-extra, .ggp-footer .ggp-count, .ggp-footer .ggp-actions{ display:none !important; }
  .ggp-footer{ border-top:0; margin-top:8px; padding-top:0; }
}
</style>
<!-- GGP-FOOTER-CSS END -->
</head>
<body>
<div id="app"></div>

<script>
const AP_OPTS=['AP','FD'];
const LAT_ARMED_OPTS=['HDG','NAV','GPS','LOC'];
const LAT_ACTIVE_OPTS=['HDG','NAV','GPS','LOC','TO or GA'];
const VERT_ARMED_OPTS=['IAS','ALTS','ALTV','VS','VP','GP','GS','VP/GP'];
const VERT_ACTIVE_OPTS=['IAS','ALT','VS','GS','GP','VP','TO or GA'];

// ---- Key insight content, tied to the 6 concepts you flagged ----
const KI = {
  1:{tag:'KEY CONCEPT · Command Line discipline',
     text:"Trust the Scoreboard, not the panel lights. Several autopilot buttons are modal — press once for one state, press again for a different one — so every button press gets confirmed on the PFD Command Line at the top of the screen, not by lights or text on the autopilot panel itself. That habit is the backbone of everything else in this quiz."},
  2:{tag:'KEY CONCEPT · GS/GP defeats ALTS',
     text:"Once the Glideslope or Glidepath is captured, the Garmin autopilot will NOT honor the selected altitude (ALTS) anymore. The descent simply continues until you command otherwise — level off, go missed, or land. This is one of the sharpest gotchas in the whole system, and it's why you retwist ALTS to the missed-approach altitude before you ever need it."},
  3:{tag:'KEY CONCEPT · Modal buttons & the heading-bug habit',
     text:"Because AP buttons are modal, confirm every press on the Command Line — never assume from memory which state you're in. And build the habit of syncing the heading bug to your current track whenever you go back to HDG mode after flying NAV/GPS. Skip that step and HDG can command a surprise turn the instant it activates."},
  4:{tag:'KEY CONCEPT · VNAV vs. APR',
     text:"VNAV (the VNV arm) governs the vertical path on legs outside the leg leading to the FAF. APR — armed as GP — governs the leg leading to the FAF and everything inward. That's exactly why you can see both armed at once, shown here as \u201cVP/GP\u201d: they're covering two different segments of the same approach."},
  5:{tag:'KEY CONCEPT · Activate VTF vs. Activate Leg to FAF',
     text:"Activating Vectors-to-Final can delete approach waypoints that aren't on the final approach course (in this scenario: PRB, FRAMS, MQO). Some pilots prefer Activate Leg to the FAF waypoint instead, precisely to keep those waypoints in the flight plan. Know which one you're using, and why."},
  6:{tag:'KEY CONCEPT · Dive-and-drive fallback',
     text:"If the approach doesn't load with +V, there's no advisory glidepath diamond coming — don't wait for it. Use VS (roughly -800 fpm) to step down to each published altitude, leveling at every stepdown fix, all the way to the MDA. Same rule if +V is loaded but the diamond never arms or captures: watch the VDI and Command Line, and revert to dive-and-drive."}
};

// Proven working pattern from the ATC Chair-Fly Trainer app: plain Web Audio
// oscillators, with getAudioCtx() creating/resuming the context and NEVER waiting
// on the resume() promise before making sound. The earlier version wrapped tone
// scheduling inside resume().then(...) — deferring it into a microtask that runs
// *after* the click gesture's call stack ends, which iOS Safari can refuse to
// treat as still being "within the gesture". Calling resume() and immediately,
// synchronously scheduling the oscillator (not waiting for the promise) is what
// actually works reliably.
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freqStart, freqEnd, duration, type, gainPeak){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
  if(freqEnd !== freqStart) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), ctx.currentTime + duration);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration + 0.02);
}
function playDing(){
  playTone(880, 880, 0.12, 'sine', 0.3);
  setTimeout(()=>playTone(1318.5, 1318.5, 0.18, 'sine', 0.3), 90);
}
function playBoing(){
  playTone(300, 110, 0.35, 'triangle', 0.28);
}
function beep(good){ getAudioCtx(); if(good) playDing(); else playBoing(); }

// ---- radio audio: static bed + squelch clicks (Web Audio, no files; App Conventions §12) ----
const RADIO={buf:null, bed:null, on:false};
function radioInit(){
  try{
    const ctx = getAudioCtx();
    if(!RADIO.buf){
      const sr=ctx.sampleRate, buf=ctx.createBuffer(1, sr*2, sr), d=buf.getChannelData(0);
      let b0=0,b1=0,b2=0;
      for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; b0=.99765*b0+w*.0990460; b1=.96300*b1+w*.2965164; b2=.57000*b2+w*1.0526913; d[i]=(b0+b1+b2+w*.1848)*.11; }
      RADIO.buf=buf;
      const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=0.6;
      RADIO.bed=ctx.createGain(); RADIO.bed.gain.value=0;
      src.connect(bp).connect(RADIO.bed).connect(ctx.destination); src.start();
    }
    return ctx;
  }catch(e){ return null; }
}
function squelchClick(level){
  if(!VP.squelch || !RADIO.buf || !audioCtx) return;
  const ctx=audioCtx, t=ctx.currentTime, src=ctx.createBufferSource(); src.buffer=RADIO.buf;
  const g=ctx.createGain(), hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.5*level, t+0.005); g.gain.exponentialRampToValueAtTime(0.001, t+0.14);
  src.connect(hp).connect(g).connect(ctx.destination); src.start(t, Math.random()); src.stop(t+0.16);
}
function radioOn(){
  if(!RADIO.bed) return; RADIO.on=true;
  const t=audioCtx.currentTime; squelchClick(Math.max(VP.noise,0.35));
  RADIO.bed.gain.cancelScheduledValues(t); RADIO.bed.gain.setTargetAtTime(VP.noise*0.6, t+0.03, 0.02);
}
function radioOff(){
  if(!RADIO.bed || !RADIO.on) return; RADIO.on=false;
  const t=audioCtx.currentTime;
  RADIO.bed.gain.cancelScheduledValues(t); RADIO.bed.gain.setTargetAtTime(0, t, 0.02);
  squelchClick(Math.max(VP.noise,0.35));
}


const DIGIT_WORDS={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine'};
function spellDigits(numStr){ return numStr.split('').map(d=>DIGIT_WORDS[d]).join(' '); }
// Aviation phraseology: headings are spoken digit-by-digit ("one one zero"), never as a
// whole number ("one hundred ten"). Relative turn amounts in degrees ("turn right 20 degrees")
// are read normally, since they're a magnitude, not a heading.
function speakifyHeadings(text){
  return text
    .replace(/(\bheading\s+)(\d{2,3})\b(?!\s*degrees?)/gi, (m,pre,num)=>pre+spellDigits(num))
    .replace(/(\bturn\s+(?:left|right)\s+)(\d{2,3})\b(?!\s*degrees?)/gi, (m,pre,num)=>pre+spellDigits(num))
    // Victor airways (V27, V101, ...) are read "Victor two seven", digit-by-digit.
    .replace(/\bV(\d{1,3})\b/g, (m,num)=>'Victor '+spellDigits(num));
}

// 5-letter RNAV waypoint fixes (ELZUS, FABEG, ...) are spoken as a word by real ATC, not
// spelled out letter-by-letter. All-caps text trips some TTS engines into spelling it, so
// Title-Case known fix names for speech only (display text is untouched).
// 3-letter VOR/NDB identifiers are spoken as their full FAA facility name (per NASR data),
// since that's how they're actually pronounced — GVO is "Gaviota", not "G-V-O".
const FIX_WORDS=['ELZUS','FABEG','DOBRA','JAMPO','ANIBY','CAVLI','CIMSO','WUTUB','HALDA','CADAB','PAMJI','KIZA','AFOXY','ZACKS','WURGU','GOLET'];
const NAVAID_NAMES={'GVO':'Gaviota','MQO':'Morro Bay'};
const FIX_WORD_RE = new RegExp('\\b('+FIX_WORDS.join('|')+')\\b','g');
function speakifyWaypoints(text){
  return text
    .replace(FIX_WORD_RE, (m,word)=>word.charAt(0)+word.slice(1).toLowerCase())
    .replace(/\b([A-Z]{3})\b/g, (m,id)=> NAVAID_NAMES[id] || id);
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const spoken = speakifyWaypoints(speakifyHeadings(text.replace(/[()]/g,'')));
    const u = new SpeechSynthesisUtterance(spoken);
    u.rate = Math.min(2, VP.rate||1); u.pitch = VP.pitch||1; u.volume = VP.vol;
    const v = getChosenVoice(); if(v) u.voice = v;
    if(VP.squelch || VP.noise>0){ radioInit(); u.onstart = radioOn; u.onend = radioOff; u.onerror = radioOff; }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakATC(text){ if(!muteATC) speak(text); }

      <path d="M-9,-38 L9,-38" stroke-width="2.5" fill="none"/>

}

// ---- mini HSI + altitude tape (situation graphic) ----
const GMONO = 'ui-monospace, SF Mono, Menlo, Consolas, monospace';
const pad3 = n => String(((Math.round(n)%360)+360)%360 || 360).padStart(3,'0');
function hsiSvg(hdg, bug){
  const W=132, H=150, cx=66, cy=86, r=50;
  let rose='';
  for(let d=0; d<360; d+=5){
    const len = d%30===0 ? 9 : (d%10===0 ? 6 : 3.5);
    rose += `<line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy-r+len}" stroke="#e8ecef" stroke-width="${d%30===0?1.6:1}" transform="rotate(${d} ${cx} ${cy})"/>`;
    if(d%30===0){
      const lbl = {0:'N',90:'E',180:'S',270:'W'}[d] || String(d/10);
      rose += `<text x="${cx}" y="${cy-r+21}" fill="#e8ecef" font-family="${GMONO}" font-size="${d%90===0?11:9.5}" font-weight="${d%90===0?700:500}" text-anchor="middle" transform="rotate(${d} ${cx} ${cy})">${lbl}</text>`;
    }
  }
  const bugShape = `<g transform="rotate(${bug} ${cx} ${cy})"><path d="M${cx-7},${cy-r-5} h14 v5 l-7,5 l-7,-5 Z" fill="#00e5ff" stroke="#000" stroke-width="0.8"/></g>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heading ${pad3(hdg)}, heading bug ${pad3(bug)}">
    <circle cx="${cx}" cy="${cy}" r="${r+1}" fill="#15191f" stroke="#3a4552" stroke-width="1.5"/>
    <g transform="rotate(${-hdg} ${cx} ${cy})">${rose}${bugShape}</g>
    <path d="M${cx},${cy-11} L${cx+2},${cy-3} L${cx+11},${cy+1} L${cx+11},${cy+3} L${cx+2},${cy+2} L${cx+1.5},${cy+8} L${cx+5},${cy+10.5} L${cx+5},${cy+12} L${cx},${cy+11} L${cx-5},${cy+12} L${cx-5},${cy+10.5} L${cx-1.5},${cy+8} L${cx-2},${cy+2} L${cx-11},${cy+3} L${cx-11},${cy+1} L${cx-2},${cy-3} Z" fill="#e8ecef"/>
    <path d="M${cx-5},${cy-r-8} L${cx+5},${cy-r-8} L${cx},${cy-r-1} Z" fill="#e8ecef"/>
    <rect x="${cx-23}" y="2" width="46" height="21" rx="2" fill="#000" stroke="#e8ecef" stroke-width="1.3"/>
    <text x="${cx}" y="17.5" fill="#e8ecef" font-family="${GMONO}" font-size="14" text-anchor="middle">${pad3(hdg)}°</text>
    <rect x="2" y="${H-22}" width="58" height="20" rx="2" fill="#000" stroke="#3a4552"/>
    <text x="7" y="${H-8}" fill="#8b96a3" font-family="${GMONO}" font-size="8.5">HDG</text>
    <text x="56" y="${H-7.5}" fill="#00e5ff" font-family="${GMONO}" font-size="12.5" text-anchor="end">${pad3(bug)}°</text>
  </svg>`;
}
function tapeSvg(alt, alts){
  const W=74, H=150, x0=8, tw=58, top=28, bot=H-4, mid=(top+bot)/2, ppf=0.11;
  const yOf = a => mid - (a-alt)*ppf;
  let ticks='';
  const lo = Math.floor((alt-600)/100)*100, hi = Math.ceil((alt+600)/100)*100;
  for(let a=lo; a<=hi; a+=100){
    if(a<0) continue;
    const y=yOf(a); if(y<top+2||y>bot-2) continue;
    ticks += `<line x1="${x0+tw-8}" y1="${y}" x2="${x0+tw}" y2="${y}" stroke="#e8ecef" stroke-width="1"/>`;
    if(a%200===0 && Math.abs(y-mid)>11)
      ticks += `<text x="${x0+tw-11}" y="${y+3.5}" fill="#e8ecef" font-family="${GMONO}" font-size="10" text-anchor="end">${a}</text>`;
  }
  const yb = Math.max(top+4, Math.min(bot-4, yOf(alts)));
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Altitude ${alt}, ALTS ${alts}">
    <defs><clipPath id="tapeClip"><rect x="${x0}" y="${top}" width="${tw}" height="${bot-top}"/></clipPath></defs>
    <rect x="${x0}" y="${top}" width="${tw}" height="${bot-top}" fill="rgba(10,20,35,.62)"/>
    <g clip-path="url(#tapeClip)">${ticks}
      <path d="M${x0},${yb-6} h5 v12 h-5 Z M${x0+5},${yb-6} l4,6 l-4,6 Z" fill="#00e5ff" stroke="#000" stroke-width="0.6"/>
    </g>
    <rect x="${x0-2}" y="2" width="${tw+4}" height="22" rx="2" fill="#000" stroke="#3a4552"/>
    <text x="${x0+2}" y="10.5" fill="#8b96a3" font-family="${GMONO}" font-size="7.5">ALTS</text>
    <text x="${x0+tw}" y="21" fill="#00e5ff" font-family="${GMONO}" font-size="12.5" text-anchor="end">${alts}</text>
    <path d="M${x0-4},${mid} L${x0+3},${mid-9} H${x0+tw+2} V${mid+9} H${x0+3} Z" fill="#000" stroke="#e8ecef" stroke-width="1.3"/>
    <text x="${x0+tw-1}" y="${mid+4.5}" fill="#e8ecef" font-family="${GMONO}" font-size="13" text-anchor="end">${alt}</text>
  </svg>`;
}
function sitGfx(q){
  if(!q.sit) return '';
  const [h,b,a,s] = q.sit;
  return `<div class="sitGfx">${hsiSvg(h,b)}${tapeSvg(a,s)}</div>`;
}

    <div class="topbar">

      <label class="tbChip smTb" title="Study mode: step back and forth, jump between flights, retry. Score becomes unofficial."><input type="checkbox" ${studyMode?'checked':''} onchange="setStudy(this.checked)">Study</label>

    const img = FLIGHT_IMAGES[q.flightIdx];
    html += `<div class="flightImgWrap"><div class="flightImgBox"><img class="flightImg" src="${img.src}" alt="${esc(img.caption)}">${aircraftSvg(img.ac)}</div><div class="flightImgCaption">${esc(img.caption)}</div></div>`;

  html += `<div class="card"><div class="qTop"><div class="qMain">

    ${q.flag?`<div class="flagLine">${esc(q.flag)}</div>`:''}
    <div class="atcRow">
      <div class="atcIcon">${isVerbal?'🎙️':'📍'}</div>
      <div style="flex:1">
        <div class="atcLabel">${isVerbal?'ATC INSTRUCTION':'SITUATION'}</div>

        ${isVerbal?`<button class="speakBtn" onclick="speak(QUESTIONS[${qi}].atc)">🔊 Replay ATC</button>`:''}
      </div>
    </div>
    ${q.situation?`<div class="actionsLabel">SITUATION</div><div class="situationText">${esc(q.situation)}</div>`:''}

// Column order follows the Garmin AXIS Command Line (12-Oct-2026): LAT ARM(white) · LAT ACT(green) · AP/FD(green, centered) · VERT ACT(green) · VERT ARM(white)
const SLOT_GROUPS=[
    {key:'latArmed',label:'LAT ARMED',opts:LAT_ARMED_OPTS,color:'White'},
    {key:'latActive',label:'LAT ACTIVE',opts:LAT_ACTIVE_OPTS,color:'Green'},
    {key:'ap',label:'AP / FD',opts:AP_OPTS,color:'Green'},
    {key:'vertActive',label:'VERT ACTIVE',opts:VERT_ACTIVE_OPTS,color:'Green'},
    {key:'vertArmed',label:'VERT ARMED',opts:VERT_ARMED_OPTS,color:'White'},
];

function renderState(q){
  let h = `<div class="card"><div class="slotsLabel">WHAT DOES THE COMMAND LINE SHOW?</div><div class="slotGrid">`;
  SLOT_GROUPS.forEach(g=>{
    const cur = guess[g.key]!==undefined ? guess[g.key] : '';
    h += `<div class="slotGroup${g.key==='ap'?' apGroup':''}"><div class="slotName">${g.label}</div>
      <div class="slotBox sel${g.color}${answered?' dis':''}"><span class="slotVal">${cur===''?'&nbsp;':esc(cur)}</span>
      <select aria-label="${g.label}" ${answered?'disabled':''} onchange="pick('${g.key}',this.value)">
        <option value="" ${cur===''?'selected':''}>&nbsp;</option>
        ${g.opts.map(o=>`<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('')}
      </select></div></div>`;
  });
  h += `</div>`;
  if(!answered){
    h += navRow(`<button class="submitBtn" onclick="submit()">Check Command Line</button>`);
  } else {
    h += renderResultState(q);
    h += navRow(`<button class="nextBtn" onclick="next()">${qi+1>=TOTAL?'Finish':'Next question →'}</button>`);
    h += tryAgainHTML();
  }
  h += `</div>`;
  return h;
}

function renderResultState(q){
  const c=q.correct;
  let allGood=true;
  let boxes = SLOT_GROUPS.map(g=>{
    const k=g.key, gVal = guess[k], v = c[k];
    const match = gVal===v; if(!match) allGood=false;
    return `<div class="annBox ${match?'match':'miss'}${k==='ap'?' apBox':''}"><span class="k">${g.label}</span><span class="v">${v===''?'&nbsp;':v}</span>${match?'':`<span class="yours">you: ${gVal===''?'(blank)':gVal}</span>`}</div>`;
  }).join('');
  return `<div class="resultBanner ${allGood?'good':'bad'}">${allGood?'✓ Ding — Command Line confirmed.':'✗ Boing — not quite. Correct state below.'}</div>
          <div class="annStrip">${boxes}</div>`;
}

function renderMC(q){
  let h = `<div class="card"><div class="slotsLabel">CHOOSE THE CORRECT TECHNIQUE</div>`;
  q.mcOptions.forEach((opt,i)=>{
    const sel = mcSel===i?'sel':'';
    h += `<div class="mcOption ${sel}" onclick="pickMC(${i})">${esc(opt)}</div>`;
  });
  if(!answered){
    h += navRow(`<button class="submitBtn" ${mcSel===null?'disabled':''} onclick="submit()">Check Answer</button>`);
  } else {
    const good = mcSel===q.mcCorrect;
    h += `<div class="resultBanner ${good?'good':'bad'}">${good?'✓ Ding — correct.':'✗ Boing — correct answer highlighted below.'}</div>`;
    h += `<div style="margin-top:4px;font-size:13.5px;color:var(--muted);">Correct: ${esc(q.mcOptions[q.mcCorrect])}</div>`;
    h += navRow(`<button class="nextBtn" onclick="next()">${qi+1>=TOTAL?'Finish':'Next question →'}</button>`);
    h += tryAgainHTML();
  }
  h += `</div>`;
  return h;
}

function pick(key,val){ if(answered) return; guess[key]=val; render(); }
function pickMC(i){ if(answered) return; mcSel=i; render(); }

function submit(){
  const q=QUESTIONS[qi];
  let good;
  if(q.type==='mc'){ good = mcSel===q.mcCorrect; }
  else {
    good = ['ap','latArmed','latActive','vertArmed','vertActive'].every(k=>guess[k]===q.correct[k]);
  }
  const r = results[qi];
  if(!r){ results[qi] = {first:good, good, guess:{...guess}, mcSel, tries:1}; if(good) score++; }
  else { r.good=good; r.guess={...guess}; r.mcSel=mcSel; r.tries++; }   // a retry never changes the score
  answered=true;
  beep(good);
  render();
}

// ---- Study mode navigation ----
function navRow(mainBtn){
  if(!studyMode) return mainBtn;
  return `<div class="navRow"><button class="smNav" type="button" aria-label="Previous question" onclick="go(qi-1)" ${qi===0?'disabled':''}>‹</button>${mainBtn}<button class="smNav" type="button" aria-label="Next question" onclick="go(qi+1)">›</button></div>`;
}
function tryAgainHTML(){
  return studyMode ? `<button class="tryBtn" type="button" onclick="tryAgain()">↺ Try again <small style="font-weight:400;opacity:.8;">(first try still counts)</small></button>` : '';
}
function narrowBar(){ try{ return window.matchMedia('(max-width:480px)').matches; }catch(e){ return false; } }
// Top-bar Study checkbox: switch mid-quiz. Once on, the run stays unofficial even if switched off again.
function setStudy(on){ studyMode=!!on; if(studyMode) studyUsed=true; render(); }
function tryAgain(){
  if(!studyMode) return;
  answered=false; guess=defaultGuessFor(qi); mcSel=null; render();
}
// Show question idx. Answered questions come back as answered (locked, with the result); ATC auto-plays
// only for a question not yet answered. Past the last question = the debrief.
function go(idx){
  if(idx<0) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(idx>=TOTAL){ qi=TOTAL; render(); return; }
  qi=idx; pendingKI=null;
  const r=results[idx];
  if(r){ answered=true; guess={...r.guess}; mcSel=r.mcSel; lastSpokenQi=idx; }
  else { answered=false; guess=defaultGuessFor(idx); mcSel=null; }
  render();
}

function jumpToFlight(flightIdx){
  const idx = QUESTIONS.findIndex(q=>q.flightIdx===flightIdx);
  if(idx<0) return;
  if(!studyMode) return;   // the Flight pull-down only shows in Study mode
  lastSpokenQi=-1;
  go(idx);
}

function next(){ go(qi+1); }

function renderSummary(app){
  let html;
  if(!studyUsed){
    const pct = Math.round((score/TOTAL)*100);
    html = `<h1>Debrief</h1><p class="sub">All ${TOTAL} rows across all 9 flights, complete.</p>

    html = `<h1>Debrief</h1>

    </div>`;
  }
  html += `
    <div class="slotsLabel">THE SIX THINGS WORTH REMEMBERING</div>`;
  [1,2,3,4,5,6].forEach(n=>{
    html += `<div class="kiRecap"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <b>${esc(KI[n].tag)}</b>
        <button class="voiceBtn" style="flex:0 0 auto;" onclick="speak(KI[${n}].text)">🔊</button>
      </div><p>${esc(KI[n].text)}</p></div>`;
  });
  if(studyMode) html += `<button class="replayBtn" onclick="go(TOTAL-1)">‹ Back to the last question</button>`;
  html += `<button class="replayBtn" ${studyMode?'style="margin-top:8px;"':''} onclick="restart()">Fly it again</button>`;
  html += renderFooter();
  app.innerHTML = html;
}

let hitCounted=false;   // count one open per page load ("Fly it again" re-draws the entry page)
function loadHitCounter(){
  if(hitCounted) return; hitCounted=true;
  const el = document.getElementById('hitCounter');   // no element now: counts silently (App Conventions §6b)
  fetch('https://tally.yuki.sh/hits/wamware/digital-autopilots-quiz')
    .then(r => r.json())
    .then(d => {
      const n = d && d.visit;
      if (el && el.isConnected && typeof n === 'number') el.textContent = 'Opened ' + n.toLocaleString() + (n === 1 ? ' time' : ' times');
    })
    .catch(() => { /* counter is a nice-to-have, never block the app */ });
}

function initAudio(){
  // Same as the working reference app: unlock the AudioContext on the Start
  // button's click gesture. getAudioCtx() itself is enough — no oscillator
  // needs to actually play here.
  getAudioCtx();
}
function startQuiz(){
  initAudio();
  const c=document.getElementById('smChk'); studyMode=!!(c&&c.checked); studyUsed=studyMode;
  resetResults(); qi=0; answered=false; mcSel=null; lastSpokenQi=-1; guess=defaultGuessFor(0); render(); window.scrollTo(0,0);
}

document.addEventListener('keydown', function(e){
  // Study mode: ← / → step between questions. Ignored while a pull-down, text field or slider has focus
  // (arrows change its value there) and with modifier keys held.
  if((e.key==='ArrowLeft'||e.key==='ArrowRight') && studyMode && document.querySelector('.topbar')||(e.key==='ArrowLeft'&&studyMode&&qi>=TOTAL)){
    const t=e.target, tag=t&&t.tagName;
    if(tag==='SELECT'||tag==='INPUT'||tag==='TEXTAREA'||(t&&t.isContentEditable)) return;
    if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
    e.preventDefault();
    go(e.key==='ArrowLeft' ? (qi>=TOTAL?TOTAL-1:qi-1) : qi+1);
    return;
  }
  if(e.key!=='Enter') return;
  if(qi>=TOTAL) return;
  const q=QUESTIONS[qi];
  if(!answered){
    if(q.type==='mc'){ if(mcSel!==null) submit(); }
    else { submit(); }
  } else {
    next();
  }
});

renderIntro();
</script>

<script>
(() => {
  if (window.__ggpFooter) return;
  window.__ggpFooter = true;
  // Every app's footer share button shares the Control Panel, not the app itself.
  const SHARE_URL   = 'https://geezer-geek-pilot-control-panel.netlify.app/';
  const SHARE_TITLE = 'GeezerGeek Pilot Apps';
  const SHARE_TEXT  = 'Planning, weather, ATC-practice and safety tools for GA pilots, from GeezerGeek Pilot.';
  const flash = (btn) => {
    if (btn.dataset.ggpBusy) return;
    btn.dataset.ggpBusy = '1';
    const label = btn.querySelector('span') || btn;
    const original = label.textContent;
    label.textContent = label === btn ? 'Link copied!' : 'Link copied to clipboard!';
    setTimeout(() => { label.textContent = original; delete btn.dataset.ggpBusy; }, 2200);
  };
  // One listener on the document, so it also covers footers an app draws later and any other
  // button given the ggp-share class.
  document.addEventListener('click', async (ev) => {
    const btn = ev.target instanceof Element ? ev.target.closest('.ggp-share') : null;
    if (!btn) return;
    ev.preventDefault();
    if (navigator.share) {
      try { await navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: SHARE_URL }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; /* else fall through */ }
    }
    try {
      await navigator.clipboard.writeText(SHARE_URL);
      flash(btn);
    } catch (err) {
      window.location.href = 'mailto:?subject=' + encodeURIComponent(SHARE_TITLE)
        + '&body=' + encodeURIComponent(SHARE_TEXT + ' ' + SHARE_URL);
    }
  });
  // Open counter: shown only where the footer has #ggpCount (the Control Panel). Apps count silently.
  const countEl = document.getElementById('ggpCount');
  if (countEl) {
    fetch('https://tally.yuki.sh/hits/wamware/geezer-geek-pilot-control-panel.json')
      .then(r => r.json())
      .then(d => {
        const base = parseInt(countEl.dataset.base, 10) || 0;  // pre-Tally opens, App Conventions §6b
        const n = d && typeof d.visit === 'number' ? d.visit + base : null;
        if (typeof n === 'number') countEl.textContent = 'Opened ' + n.toLocaleString() + (n === 1 ? ' time' : ' times');
      })
      .catch(() => { /* counter is a nice-to-have, never block the app */ });
  }
})();
</script>
